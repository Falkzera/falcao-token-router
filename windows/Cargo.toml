# Workspace do porte Windows. Nada aqui muda o app macOS — tudo vive sob windows/.
[workspace]
resolver = "2"
members = ["crates/router-core", "crates/router-cli", "crates/fake-claude"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: o oauthAccount cru é regravado preservando a ordem das chaves.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
junction = "2"
regex = "1"
chrono-tz = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
