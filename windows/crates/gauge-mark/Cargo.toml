[package]
name = "gauge-mark"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "O anel-medidor da bandeja do Falcão Token Router."
publish = false

[dependencies]
# png-format: a prévia da bandeja (`icongen`) grava PNG.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }

[[bin]]
name = "icongen"
path = "src/bin/icongen.rs"
