name: Feature request
description: Suggest something the app should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. One thing the project won't trade away: a
        number on screen always says where it came from. A proposal that makes the
        display simpler by dropping provenance is the wrong trade for this app.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: >
        Describe the situation you're in, not the solution you have in mind. The
        best features here came from someone describing a moment where the app
        left them guessing.
      placeholder: |
        I only find out I'm near the weekly ceiling when I'm already mid-task.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Does it fit the project's constraints?
      description: >
        Not a filter — just so we start from the same place. If your idea needs one
        of these, say why it's worth it in the box above.
      options:
        - label: It doesn't require a server, telemetry, or a second network call
        - label: It doesn't require reading the refreshToken
        - label: It works without Xcode (Command Line Tools only)
        - label: I'm not sure
    validations:
      required: false
