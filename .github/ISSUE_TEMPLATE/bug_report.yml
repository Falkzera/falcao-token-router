name: Bug report
description: Something behaves differently than it should
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The fields below are the ones that actually shorten
        the round trip. The most useful one is the `router doctor` output — it
        names the problem in most of the failure modes this app has.

        **Please redact account e-mails** before pasting anything. They're yours,
        and they don't need to be public.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: |
        `claude trabalho` opened a session on the wrong account. The panel showed
        the group's active account as X, but `/status` inside the session said Y.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `router doctor`
      description: |
        Run this and paste the result (e-mails redacted):
        `'/Applications/FalcaoTokenRouter.app/Contents/MacOS/router' doctor`
      render: text
    validations:
      required: false

  - type: dropdown
    id: source
    attributes:
      label: Where did the number come from?
      description: >
        The panel says under each account: "measured … by the account's own
        session" (sensor) or "probed … by asking Claude Code directly" (probe).
      options:
        - "Sensor (the status line)"
        - "Probe (Measure accounts / router measure)"
        - "No number — the account showed as 'ready'"
        - "Not about a number"
    validations:
      required: true

  - type: dropdown
    id: group-kind
    attributes:
      label: Which kind of group?
      description: The default group runs in `~/.claude`; the others in a dedicated profile.
      options:
        - "The default group (~/.claude)"
        - "A dedicated group"
        - "Both / not sure"
        - "Not about a group"
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the Meter tab, or `defaults read /Applications/FalcaoTokenRouter.app/Contents/Info.plist CFBundleShortVersionString`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - "DMG from the releases page"
        - "Built from source"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and hardware
      placeholder: "macOS 26.1, Apple Silicon (M2)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it's reproducible. If it isn't, say what you were doing when it happened.
    validations:
      required: false

  - type: checkboxes
    id: context
    attributes:
      label: Anything of these apply?
      options:
        - label: The terminal I used was open before I installed the integration (or I hadn't run `source ~/.zshrc` in it)
        - label: I had just updated or moved the app
        - label: macOS asked me to authorize Keychain access
        - label: The account is shared with other people
    validations:
      required: false
