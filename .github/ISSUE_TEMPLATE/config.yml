blank_issues_enabled: true
contact_links:
  - name: Security or privacy issue
    url: https://github.com/Falkzera/falcao-token-router/security/advisories/new
    about: >
      Please report privately rather than in a public issue. The app copies
      Claude Code's credentials between profiles, so anything touching them
      goes here. SECURITY.md says what to include.
  - name: How to install, and why the system blocks it
    url: https://github.com/Falkzera/falcao-token-router#install
    about: >
      Neither build is signed by a paid developer account yet, so macOS
      (quarantine) and Windows (SmartScreen) stop it once. Each platform's
      install guide has the way through.
  - name: How it works, and how to port it
    url: https://github.com/Falkzera/falcao-token-router/tree/main/docs
    about: docs/ARCHITECTURE.md explains the mechanism; docs/PORTING.md maps what a new platform needs, with the Windows port as the worked example.
  - name: Contributing guide
    url: https://github.com/Falkzera/falcao-token-router/blob/main/CONTRIBUTING.md
    about: Building each platform, the workflow, the checks that fail a PR, and the invariants.
